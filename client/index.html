<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Campsite - Survival</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="login-screen">
        <div class="login-box">
            <h1>SURVIVE THE NIGHT</h1>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button id="loginBtn">LOG IN</button>
            <button id="registerBtn">REGISTER</button>
            <p id="auth-message"></p>
        </div>
    </div>

    <div id="win-popup" class="popup" style="display: none;">
        <h1 id="score-message">SURVIVED!</h1>
        <button onclick="window.tryAgain()">Play Again</button>
        <button onclick="window.exitGame()">Exit</button>
    </div>

    <div id="lose-popup" class="popup" style="display: none;">
        <h1>GAME OVER</h1>
        <p>You got caught.</p>
        <button onclick="window.tryAgain()">Try Again</button>
        <button onclick="window.exitGame()">Exit</button>
    </div>

    <a-scene 
        fog="type: linear; color: #0a0a14; near: 5; far: 40"
        background="color: #050508"
        shadow="type: pcfsoft"
    >
        <a-assets>
            <img id="grassColor" src="/textures/grass/color.jpg">
            <a-asset-item id="wolfAsset" src="/wolf_model/wolf.glb"></a-asset-item>
        </a-assets>

        <a-entity game-manager="killDistance: 3.5; winDistance: 6.0"></a-entity>

        <!-- Scene Lighting -->
        <a-light type="ambient" color="#445566" intensity="0.15"></a-light>
        <a-light type="directional" color="#778899" intensity="0.05" position="-10 20 10"></a-light>

        <a-entity id="rig" 
            wasd-controls="acceleration: 50"
            position="0 0 50" 
            boundary-checker="maxRadius: 60"
        >
            <a-entity camera look-controls="pointerLockEnabled: true" position="0 1.6 0">
                <a-light type="spot" color="#ffffff" intensity="8" angle="45" penumbra="0.3" distance="25" position="0 0 -0.5" flashlight></a-light>
            </a-entity>
        </a-entity>

        <a-entity 
            id="wolf" 
            position="0 0 -20" 
            wolf-controller="
                src: /wolf_model/wolf.glb;
                speed: 1.5; 
                roamRadius: 55; 
                detectionRange: 6; 
                chaseSpeed: 3.5
            "
            shadow="cast: true"
        ></a-entity>

        <a-entity id="camp" position="0 0 -50">
            <a-cone color="#8B4513" radius-bottom="2.5" height="2" position="0 1 0"></a-cone>
            <a-light type="point" color="#ff7700" intensity="2.5" distance="18" position="0 2 0" fire-light></a-light>
            <a-entity log-chair position="2 0 1"></a-entity>
            <a-entity log-chair position="-2 0 1"></a-entity>
        </a-entity>

        <a-plane id="ground" rotation="-90 0 0" width="120" height="120" material="src: #grassColor; repeat: 20 20; color: #333"></a-plane>
        <a-entity id="trees" tree-generator="count: 80; radius: 55"></a-entity>
        <a-entity id="mountains" mountain-boundary></a-entity>

    </a-scene>

    <script src="./src/main.js" type="module"></script>
</body>
</html>
