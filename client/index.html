<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Campsite - Survival</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-physics-system@4.0.1/dist/aframe-physics-system.min.js"></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="login-screen">
        <div class="login-box">
            <h1>THE CAMPSITE</h1>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button id="loginBtn">LOG IN</button>
            <button id="registerBtn">REGISTER</button>
            <p id="auth-message"></p>
        </div>
    </div>

    <div id="win-popup" class="popup" style="display: none;">
        <h1 id="score-message">SURVIVED!</h1>
        <button onclick="window.tryAgain()">Play Again</button>
        <button onclick="window.exitGame()">Exit</button>
    </div>

    <div id="lose-popup" class="popup" style="display: none;">
        <h1>GAME OVER</h1>
        <p>You got caught.</p>
        <button onclick="window.tryAgain()">Try Again</button>
        <button onclick="window.exitGame()">Exit</button>
    </div>

    <div id="hud">
        <div id="flashlight-note">Press F to toggle flashlight (Don't use flashflight for best experience)</div>
    </div>

    <a-scene 
        fog="type: linear; color: #0a0a14; near: 5; far: 40"
        background="color: #050508"
        shadow="type: pcfsoft"
        physics="debug: false; gravity: 0; friction: 0.01; restitution: 0.1"
    >
        <a-assets>
            <img id="grassColor" src="./textures/grass/color.jpg">
            <a-asset-item id="wolfAsset" src="./wolf_model/wolf.glb"></a-asset-item>
        </a-assets>

        <a-entity game-manager="killDistance: 3.5; winDistance: 6.0"></a-entity>

        <!-- Scene Lighting -->
        <a-light type="ambient" color="#445566" intensity="0.15"></a-light>
        <a-light type="directional" color="#778899" intensity="0.05" position="-10 20 10"></a-light>

        <!-- Player with fixed WASD controls -->
        <a-entity id="rig" 
            position="0 0 50" 
            boundary-checker="maxRadius: 60"
            kinematic-body="mass: 80"
            sphere-collider="radius: 0.5"
            simple-movement="speed: 0.15"
            tree-collision-checker
        >
            <a-entity camera look-controls="pointerLockEnabled: true" position="0 1.6 0">
                <a-light type="spot" color="#ffffff" intensity="8" angle="45" penumbra="0.3" distance="25" position="0 0 -0.5" flashlight></a-light>
            </a-entity>
        </a-entity>

        <!-- Wolf 1 -->
        <a-entity 
            id="wolf1" 
            position="-15 0 -15" 
            wolf-controller="
                src: ./wolf_model/wolf.glb;
                speed: 1.5; 
                roamRadius: 55; 
                detectionRange: 6; 
                chaseSpeed: 3.5;
                wolfId: 1
            "
            shadow="cast: true"
        ></a-entity>

        <!-- Wolf 2 -->
        <a-entity 
            id="wolf2" 
            position="15 0 -10" 
            wolf-controller="
                src: ./wolf_model/wolf.glb;
                speed: 1.3; 
                roamRadius: 50; 
                detectionRange: 7; 
                chaseSpeed: 3.2;
                wolfId: 2
            "
            shadow="cast: true"
        ></a-entity>

        <!-- Wolf 3 -->
        <a-entity 
            id="wolf3" 
            position="0 0 -25" 
            wolf-controller="
                src: ./wolf_model/wolf.glb;
                speed: 1.7; 
                roamRadius: 45; 
                detectionRange: 5; 
                chaseSpeed: 3.8;
                wolfId: 3
            "
            shadow="cast: true"
        ></a-entity>

        <a-entity id="camp" position="0 0 -50">
            <a-cone color="#8B4513" radius-bottom="2.5" height="2" position="0 1 0" static-body="shape: box; mass: 0"></a-cone>
            <a-light type="point" color="#ff7700" intensity="2.5" distance="18" position="0 2 0" fire-light></a-light>
            <a-entity log-chair position="2 0 1"></a-entity>
            <a-entity log-chair position="-2 0 1"></a-entity>
        </a-entity>

        <a-plane id="ground" 
            rotation="-90 0 0" 
            width="120" 
            height="120" 
            material="src: #grassColor; repeat: 20 20; color: #333"
            static-body="shape: box; mass: 0"
        ></a-plane>
        
        <!-- Tree generator -->
        <a-entity id="trees" tree-generator="
            count: 350; 
            minRadius: 5; 
            maxRadius: 58;
            collision: true;
            playerCollision: true
        "></a-entity>
        
        <a-entity id="mountains" mountain-boundary></a-entity>

    </a-scene>

    <!-- Load tree generator first -->
    <script src="./src/tree-generator.js"></script>
    
    <!-- Custom movement component with tree collision -->
    <script>
        // Simple Movement Component with absolute directions and tree collision
        AFRAME.registerComponent('simple-movement', {
            schema: {
                speed: { type: 'number', default: 0.15 },
                collisionDistance: { type: 'number', default: 1.0 }
            },
            
            init: function() {
                this.velocity = new THREE.Vector3();
                
                // Bind keyboard events
                this.onKeyDown = this.onKeyDown.bind(this);
                this.onKeyUp = this.onKeyUp.bind(this);
                
                window.addEventListener('keydown', this.onKeyDown);
                window.addEventListener('keyup', this.onKeyUp);
                
                // Track pressed keys
                this.keys = {
                    w: false,
                    a: false,
                    s: false,
                    d: false
                };
                
                // Store tree positions for collision
                this.treePositions = [];
                this.findTrees();
                
                // Listen for trees being added
                this.el.sceneEl.addEventListener('trees-generated', () => {
                    setTimeout(() => this.findTrees(), 100);
                });
            },
            
            findTrees: function() {
                this.treePositions = [];
                const scene = this.el.sceneEl;
                if (!scene) return;
                
                // Find all trees
                const treeGenerator = scene.querySelector('#trees');
                if (!treeGenerator) return;
                
                const trees = treeGenerator.querySelectorAll('a-entity');
                
                trees.forEach(tree => {
                    // Check if it's a tree entity (has a trunk cylinder)
                    const trunk = tree.querySelector('a-cylinder');
                    if (trunk) {
                        const position = tree.getAttribute('position');
                        let radius = 0.5; // Default
                        
                        if (trunk) {
                            const trunkRadius = trunk.getAttribute('radius');
                            const scale = tree.getAttribute('scale');
                            if (trunkRadius && scale) {
                                radius = trunkRadius * Math.max(scale.x, scale.z) * 1.5;
                            }
                        }
                        
                        this.treePositions.push({
                            x: position.x,
                            z: position.z,
                            radius: radius
                        });
                    }
                });
                
                console.log(`Found ${this.treePositions.length} trees for collision`);
            },
            
            onKeyDown: function(event) {
                switch(event.code) {
                    case 'KeyW':
                    case 'ArrowUp':
                        this.keys.w = true;
                        break;
                    case 'KeyS':
                    case 'ArrowDown':
                        this.keys.s = true;
                        break;
                    case 'KeyA':
                    case 'ArrowLeft':
                        this.keys.a = true;
                        break;
                    case 'KeyD':
                    case 'ArrowRight':
                        this.keys.d = true;
                        break;
                }
            },
            
            onKeyUp: function(event) {
                switch(event.code) {
                    case 'KeyW':
                    case 'ArrowUp':
                        this.keys.w = false;
                        break;
                    case 'KeyS':
                    case 'ArrowDown':
                        this.keys.s = false;
                        break;
                    case 'KeyA':
                    case 'ArrowLeft':
                        this.keys.a = false;
                        break;
                    case 'KeyD':
                    case 'ArrowRight':
                        this.keys.d = false;
                        break;
                }
            },
            
            checkTreeCollision: function(newX, newZ) {
                const playerRadius = 0.5;
                
                for (const tree of this.treePositions) {
                    const dx = newX - tree.x;
                    const dz = newZ - tree.z;
                    const distance = Math.sqrt(dx * dx + dz * dz);
                    
                    if (distance < playerRadius + tree.radius) {
                        return true; // Collision detected
                    }
                }
                return false; // No collision
            },
            
            tick: function() {
                if (!this.el.sceneEl.isPlaying) return;
                
                const speed = this.data.speed;
                const position = this.el.getAttribute('position');
                const camera = this.el.querySelector('[camera]');
                
                if (!camera) return;
                
                // Get camera's world direction
                const cameraWorldDirection = new THREE.Vector3();
                camera.object3D.getWorldDirection(cameraWorldDirection);
                cameraWorldDirection.y = 0;
                cameraWorldDirection.normalize();
                
                // Calculate movement vectors
                const forward = cameraWorldDirection.clone();
                const right = new THREE.Vector3();
                right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();
                const backward = forward.clone().negate();
                const left = right.clone().negate();
                
                // Reset velocity
                this.velocity.set(0, 0, 0);

                // Direction input
                if (this.keys.w) this.velocity.add(backward);
                if (this.keys.s) this.velocity.add(forward);
                if (this.keys.a) this.velocity.add(right);
                if (this.keys.d) this.velocity.add(left);

                // Normalize & apply speed
                if (this.velocity.lengthSq() > 0) {
                    this.velocity.normalize().multiplyScalar(speed);

                    const newPosition = {
                        x: position.x + this.velocity.x,
                        y: position.y,
                        z: position.z + this.velocity.z
                    };

                    // Check tree collision first
                    if (!this.checkTreeCollision(newPosition.x, newPosition.z)) {
                        // Boundary check
                        const boundaryChecker = this.el.components['boundary-checker'];
                        if (!boundaryChecker ||
                            Math.sqrt(newPosition.x ** 2 + newPosition.z ** 2) <= boundaryChecker.data.maxRadius) {
                            this.el.setAttribute('position', newPosition);
                        }
                    } else {
                        // Try sliding - check X movement only
                        const xOnlyPosition = {
                            x: position.x + this.velocity.x,
                            y: position.y,
                            z: position.z
                        };
                        
                        if (!this.checkTreeCollision(xOnlyPosition.x, xOnlyPosition.z)) {
                            const boundaryChecker = this.el.components['boundary-checker'];
                            if (!boundaryChecker ||
                                Math.sqrt(xOnlyPosition.x ** 2 + xOnlyPosition.z ** 2) <= boundaryChecker.data.maxRadius) {
                                this.el.setAttribute('position', xOnlyPosition);
                            }
                        } else {
                            // Try Z movement only
                            const zOnlyPosition = {
                                x: position.x,
                                y: position.y,
                                z: position.z + this.velocity.z
                            };
                            
                            if (!this.checkTreeCollision(zOnlyPosition.x, zOnlyPosition.z)) {
                                const boundaryChecker = this.el.components['boundary-checker'];
                                if (!boundaryChecker ||
                                    Math.sqrt(zOnlyPosition.x ** 2 + zOnlyPosition.z ** 2) <= boundaryChecker.data.maxRadius) {
                                    this.el.setAttribute('position', zOnlyPosition);
                                }
                            }
                        }
                    }
                }
            },
            
            remove: function() {
                window.removeEventListener('keydown', this.onKeyDown);
                window.removeEventListener('keyup', this.onKeyUp);
            }
        });

        // Simple tree collision checker component
        AFRAME.registerComponent('tree-collision-checker', {
            init: function() {
                // This component is just a tag to identify the player for collision
            }
        });
    </script>
    
    <script src="./src/main.js" type="module"></script>
</body>
</html>
